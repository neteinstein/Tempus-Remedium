name: Deploy Web

# Builds webApp's wasmJs production distribution and deploys it to Cloudflare Pages (free plan,
# Direct Upload project) on every push to `main`. The job only runs when the DEPLOY_CLOUDFLARE_PAGES
# repo variable is 'true' (Settings -> Secrets and variables -> Actions -> Variables). It needs the
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets; CLOUDFLARE_PAGES_PROJECT overrides the
# project name (default tempus-remedium). Setup is in CI_CD.md.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: web-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  DIST_DIR: webApp/build/dist/wasmJs/productionExecutable

jobs:
  deploy-cloudflare-pages:
    name: Deploy to Cloudflare Pages
    if: vars.DEPLOY_CLOUDFLARE_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: ${{ steps.deployment.outputs.deployment-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build wasmJs production distribution
        # Retried: the build downloads Node.js and Binaryen (a GitHub release), and GitHub's
        # release downloads sometimes time out (504).
        run: |
          for attempt in 1 2 3; do
            ./gradlew :webApp:wasmJsBrowserDistribution --no-daemon --stacktrace && exit 0
            echo "::warning::Web build failed (attempt $attempt), retrying in 30 s"
            sleep 30
          done
          exit 1

      - name: Deploy to Cloudflare Pages
        id: deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ env.DIST_DIR }} --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'tempus-remedium' }} --branch=main --commit-hash=${{ github.sha }}
