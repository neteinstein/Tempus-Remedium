name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

# The jobs below run in parallel; see CI_CD.md for what each one covers.
jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: remedio-em-dia-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-web:
    name: Build web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build web distribution (Kotlin/Wasm)
        run: ./gradlew :webApp:wasmJsBrowserDistribution
      - uses: actions/upload-artifact@v4
        with:
          name: remedio-em-dia-web
          path: webApp/build/dist/wasmJs/productionExecutable
          if-no-files-found: error

  unit-tests:
    name: Unit and screenshot tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Core (JVM) and Android (Robolectric) tests, screenshots verified against the recorded goldens
        run: ./gradlew :core:jvmTest :androidApp:testDebugUnitTest :androidApp:verifyRoborazziDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            androidApp/build/reports/tests
            androidApp/build/outputs/roborazzi
            androidApp/build/test-results
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: ktlint (Spotless) and Android Lint
        run: ./gradlew spotlessCheck :androidApp:lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: androidApp/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Kover reports and thresholds
        run: ./gradlew koverXmlReport koverHtmlReport koverVerify :core:koverVerify
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage"
            echo
            echo "| Scope | Line coverage |"
            echo "| --- | --- |"
            for scope in "core:core" "merged (core + Android):."; do
              name="${scope%%:*}"; dir="${scope#*:}"
              report="$dir/build/reports/kover/report.xml"
              if [ -f "$report" ]; then
                line=$(grep -o '<counter type="LINE"[^>]*>' "$report" | tail -1)
                missed=$(echo "$line" | sed -E 's/.*missed="([0-9]+)".*/\1/')
                covered=$(echo "$line" | sed -E 's/.*covered="([0-9]+)".*/\1/')
                pct=$(awk "BEGIN { printf \"%.1f\", 100 * $covered / ($covered + $missed) }")
                echo "| $name | ${pct}% |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            build/reports/kover
            core/build/reports/kover
          if-no-files-found: ignore

  # iOS: not applicable yet. There is no iOS target; CI_CD.md explains how to add one.
