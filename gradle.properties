org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

kotlin.code.style=official
# npm instead of yarn: yarn is downloaded from github.com, which sandboxed agent
# containers cannot reach (see AGENTS.md).
kotlin.js.yarn=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.mpp.stability.nowarn=true

# R8 full mode for the minified release build (androidApp/build.gradle.kts + proguard-rules.pro).
# AGP's default already; pinned so a change of default is a visible change here.
android.enableR8.fullMode=true
